<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0c0f" />
    <title>Offline · Nikhil Rai</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #0a0c0f; color: #e9ebee;
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; text-align: center; }
      .code { font: 700 clamp(4rem, 18vw, 9rem)/1 ui-sans-serif, system-ui, sans-serif; color: #eba73f; letter-spacing: -0.04em; }
      .mono { font: 12px ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: #9aa3ae; }
      p { color: #9aa3ae; max-width: 32rem; margin: 12px auto; }
      button { margin-top: 20px; height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: #eba73f;
        color: #1a1206; font-weight: 600; font-size: 15px; cursor: pointer; }
      button:focus-visible { outline: 2px solid #63c7d9; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="code">503</div>
      <div class="mono">link down · retrying</div>
      <h1>You're offline.</h1>
      <p>This page wasn't saved yet. Reconnect and it will load.</p>
      <p lang="hi">आप ऑफ़लाइन हैं। इंटरनेट जुड़ते ही पेज खुल जाएगा।</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
